services:
  - type: web
    name: kingdom-ways-cms
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: churchweb-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: MPESA_ENV
        value: sandbox
      - key: SEED_ADMIN
        value: "false"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: churchweb-db
    plan: free
