<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
content="Kingdom Ways Pentecostal Church Member Registration and Login">

<meta name="theme-color" content="#103B73">

<title>Kingdom Ways Church | Member Registration & Login</title>

<link rel="icon" href="images/logo.png">

<link rel="stylesheet" href="btn.css">

</head>

<body>

<!-- ================= LOGO ================= -->

<div class="logo">

    <img
    src="images/logo.png"
    alt="Kingdom Ways Pentecostal Church Logo">

</div>

<!-- ================= BRAND HEADER ================= -->

<div class="brand-header">

    <span class="brand-church-name">KINGDOMWAYS</span>

    <span class="brand-tagline">Pentecostal Church · Member Portal</span>

</div>

<!-- ================= MAIN CONTAINER ================= -->

<div class="button-container">

<!-- ================= SIGN UP ================= -->

<section id="signup">

<h1>New Member Registration</h1>

<p>

Register once and wait for church administration approval.

</p>

<form id="signupForm" autocomplete="on">

<label for="fullName">

Full Name

</label>

<input

type="text"

id="fullName"

name="fullName"

placeholder="Enter Full Name"

autocomplete="name"

required>

<label for="signupPhone">

Phone Number

</label>

<input

type="tel"

id="signupPhone"

name="signupPhone"

placeholder="07XXXXXXXX"

pattern="[0-9]{10,}"

autocomplete="tel"

required>

<button
type="submit"
id="signupBtn">

Submit Registration

</button>

</form>

<p id="signupMessage"></p>

</section>

<!-- ================= LOGIN ================= -->

<section id="signin">

<h2>

Already an Approved Member?

</h2>

<p>

Login to access your member portal.

</p>

<p
id="rememberedHint"
class="remember-hint"
style="display:none;">

<span>Welcome back, <strong id="rememberedName"></strong></span>

<button
type="button"
id="clearRemembered"
class="link-btn">

Not you?

</button>

</p>

<form id="loginForm" autocomplete="on">

<label for="loginPhone">

Phone Number

</label>

<input

type="tel"

id="loginPhone"

name="loginPhone"

placeholder="07XXXXXXXX"

autocomplete="tel"

required>

<label for="loginUsername">

Full Name

</label>

<input

type="text"

id="loginUsername"

name="loginUsername"

placeholder="Enter your full name"

autocomplete="name"

required>

<!-- Loading Spinner -->

<div
id="loginLoader"
class="loader"
style="display:none;">
</div>

<button
type="submit"
id="loginBtn">

Sign In

</button>

</form>

<p id="loginMessage"></p>

</section>

</div>

<!-- ================= FOOTER ================= -->

<footer>

<p>

© <span id="year"></span>

Kingdom Ways Pentecostal Church.

All Rights Reserved.

</p>

</footer>

<!-- ================= JAVASCRIPT ================= -->

<script src="btn.js"></script>

</body>

</html>
