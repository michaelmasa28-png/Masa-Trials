<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" type="image/png" href="images/logo.png">    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingdom Ways | Secure Portal Entry</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="rolelogin.css">
</head>
<body>

    <!-- Ambient background light elements to mirror reflection states -->
    <div class="glow-orb premium-glow"></div>
    <div class="glow-orb structural-glow"></div>

    <div class="login-container">
        
        <!-- Central Focal Visual Anchor Group -->
        <div class="logo-wrapper">
            <span class="central-anchor">K</span>
        </div>

        <div class="portal-header">
            <h2>Authorized Access </h2>
            <p>access parameter key token below.</p>
        </div>

        <!-- Single-Key Submission Form Wrapper -->
        <form id="secureLoginForm" autocomplete="off">
            <div class="input-wrapper">
                <i class="fa-solid fa-key input-icon"></i>
                <input 
                    type="password" 
                    id="portalAccessKey" 
                    name="access_key" 
                    placeholder="ENTER ACCESS KEY" 
                    required 
                    autofocus
                >
                <div class="input-focus-line"></div>
            </div>
            <!-- Kinetic Multi-Reflective Submission Control Element -->
            <button type="submit" class="kinetic-enter-btn" id="enterBtn">
                <span>ENTER PORTAL</span>
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <div class="login-footer">
            <p>Protected by Kingdom Ways CMS Infrastructure</p>
        </div>
    </div>

    <!-- Script source path mapping straight out of the uniform app base folder -->
    <script src="rolelogin.js"></script>

</body>
</html>
