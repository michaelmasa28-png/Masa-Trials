<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="icon" type="image/png" href="images/logo.png">
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<!-- Android/Firefox tiny text fix -->
<meta name="HandheldFriendly" content="true">
<meta name="MobileOptimized" content="width">


<title>
Kingdom Ways | Connect Hub
</title>


<!-- Icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<!-- Connect Hub Style -->
<link rel="stylesheet" href="charttest.css">

<style>
.member-directory {
    padding: 10px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}
.directory-heading {
    margin: 0 0 8px 0;
    font-size: 12px;
    letter-spacing: .05em;
    text-transform: uppercase;
    opacity: .6;
}
.member-directory-list {
    max-height: 160px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.member-directory-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
}
.member-directory-item:hover {
    background: rgba(255,255,255,0.06);
}
.member-directory-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #103B73;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
}
.member-directory-avatar-wrap {
    position: relative;
    flex-shrink: 0;
}
.status-dot {
    position: absolute;
    bottom: -1px;
    right: -1px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid #0d1b33;
}
.status-dot.online {
    background: #2ecc71;
}
.status-dot.offline {
    background: #7a7a7a;
}
.member-directory-name {
    font-size: 14px;
}
.member-directory-empty {
    font-size: 13px;
    opacity: .5;
    padding: 4px 8px;
}
.conversation-item {
    position: relative;
}
.unread-badge {
    margin-left: auto;
    background: #2ecc71;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    min-width: 18px;
    height: 18px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 5px;
}
</style>


</head>



<body>


<div class="connect-wrapper">



<!-- =================================================
     LEFT PANEL
     CHAT / GROUP LIST
================================================== -->


<aside class="connect-sidebar">


<header class="connect-header">


<div class="member-profile">


<img 
id="memberPhoto"
src="images/default-avatar.png"
alt="Member Photo">


<div>

<h3 id="memberName">
Loading...
</h3>


<p id="memberNumber">
KWC-000000
</p>


</div>


</div>




<div class="header-actions">


<button id="newChatBtn" title="Start New Chat" aria-label="Start New Chat">

<i class="fa-solid fa-users"></i>

</button>



<button title="Search" aria-label="Search">

<i class="fa-solid fa-magnifying-glass"></i>

</button>



<button title="More" aria-label="More options">

<i class="fa-solid fa-ellipsis"></i>

</button>


</div>


</header>





<!-- SEARCH -->


<div class="chat-search">


<input

type="search"

id="chatSearch"

placeholder="Search conversations..."

aria-label="Search"

>


</div>




<!-- VIEW TABS (Members first, Messages behind icon) -->

<nav class="connect-nav">

<button
type="button"
class="nav-tab active"
data-view="members"
title="Members">

<i class="fa-solid fa-users"></i>

<span>Members</span>

</button>

<button
type="button"
class="nav-tab"
data-view="messages"
title="Messages">

<i class="fa-solid fa-comment-dots"></i>

<span>Messages</span>

<span class="nav-badge" id="navUnread" style="display:none;">0</span>

</button>

</nav>




<!-- MEMBERS VIEW (shown first) -->

<div class="view-panel" id="membersPanel">

<div class="member-directory" id="memberDirectorySection">

<h4 class="directory-heading">Church Members</h4>

<div
class="member-directory-list"
id="memberDirectoryList">

<!-- JavaScript loads approved members -->

</div>

</div>

</div>




<!-- MESSAGES VIEW (hidden until Messages icon) -->

<div class="view-panel hidden" id="messagesPanel">

<div
class="conversation-list"
id="conversationList">

<!-- JavaScript loads chats -->

</div>

<!-- ADMIN AREA -->

<div
id="adminSection"
class="admin-section hidden">

<h4>

<i class="fa-solid fa-shield-halved"></i>

Admin Control

</h4>

<button aria-label="Create Group">

Create Group

</button>

<button aria-label="Manage Members">

Manage Members

</button>

</div>

</div>

</aside>







<!-- =================================================
     RIGHT PANEL
     ACTIVE CHAT
================================================== -->


<main class="chat-area">





<header class="chat-header">


<button
type="button"
class="chat-back"
id="chatBackBtn"
title="Back to list"
aria-label="Back to conversations">

<i class="fa-solid fa-arrow-left"></i>

</button>



<div class="active-chat-profile">


<div 
class="group-avatar"
id="activeAvatar">

KW

</div>



<div>


<h2 id="activeChatName">

KINGDOM WAYS CONNECT

</h2>


<p id="activeChatInfo">

Select conversation

</p>



</div>


</div>



</header>









<!-- MESSAGE DISPLAY -->


<section

class="message-container"

id="messageContainer">


<div class="empty-chat">


<i class="fa-solid fa-comments"></i>


<p>

Choose a conversation to start

</p>


</div>



</section>









<!-- MESSAGE INPUT -->


<footer class="message-box">



<form id="messageForm">



<button 
type="button"
class="attach-btn">


<i class="fa-solid fa-paperclip"></i>


</button>





<input


type="text"

id="messageInput"

placeholder="Write a message..."

autocomplete="off"

aria-label="Type a message"

required>



<button

type="submit"

class="send-btn">


<i class="fa-solid fa-paper-plane"></i>


</button>



</form>



</footer>







</main>



</div>





<script src="charttest.js"></script>


</body>


</html>
