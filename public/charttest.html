<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Kingdom Ways | Connect Hub
</title>


<!-- Icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<!-- Connect Hub Style -->
<link rel="stylesheet" href="charttest.css">


</head>



<body>


<div class="connect-wrapper">



<!-- =================================================
     LEFT PANEL
     CHAT / GROUP LIST
================================================== -->


<aside class="connect-sidebar">


<header class="connect-header">


<div class="member-profile">


<img 
id="memberPhoto"
src="images/default-avatar.png"
alt="Member Photo">


<div>

<h3 id="memberName">
Loading...
</h3>


<p id="memberNumber">
KWC-000000
</p>


</div>


</div>




<div class="header-actions">


<button title="New Group">

<i class="fa-solid fa-users"></i>

</button>



<button title="Search">

<i class="fa-solid fa-magnifying-glass"></i>

</button>



<button title="More">

<i class="fa-solid fa-ellipsis"></i>

</button>


</div>


</header>





<!-- SEARCH -->


<div class="chat-search">


<input

type="search"

id="chatSearch"

placeholder="Search conversations..."

>


</div>






<!-- CHAT LIST -->


<div 
class="conversation-list"
id="conversationList">


<!-- JavaScript loads chats -->


</div>







<!-- ADMIN AREA -->


<div 
id="adminSection"
class="admin-section hidden">


<h4>

<i class="fa-solid fa-shield-halved"></i>

Admin Control

</h4>



<button>

Create Group

</button>


<button>

Manage Members

</button>


</div>



</aside>







<!-- =================================================
     RIGHT PANEL
     ACTIVE CHAT
================================================== -->


<main class="chat-area">





<header class="chat-header">


<div class="active-chat-profile">


<div 
class="group-avatar"
id="activeAvatar">

KW

</div>



<div>


<h2 id="activeChatName">

KINGDOM WAYS CONNECT

</h2>


<p id="activeChatInfo">

Select conversation

</p>



</div>


</div>



</header>









<!-- MESSAGE DISPLAY -->


<section

class="message-container"

id="messageContainer">


<div class="empty-chat">


<i class="fa-solid fa-comments"></i>


<p>

Choose a conversation to start

</p>


</div>



</section>









<!-- MESSAGE INPUT -->


<footer class="message-box">



<form id="messageForm">



<button 
type="button"
class="attach-btn">


<i class="fa-solid fa-paperclip"></i>


</button>





<input


type="text"

id="messageInput"

placeholder="Write a message..."

autocomplete="off"


required>



<button

type="submit"

class="send-btn">


<i class="fa-solid fa-paper-plane"></i>


</button>



</form>



</footer>







</main>



</div>





<script src="charttest.js"></script>


</body>


</html>
