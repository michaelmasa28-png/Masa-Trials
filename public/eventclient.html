<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Kingdom Ways Church | Events
</title>


<link rel="stylesheet" href="eventclient.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>


<body>


<div class="portal">


<!-- =========================
HEADER
========================= -->


<header class="topbar">


<div class="brand">

<i class="fa-solid fa-church"></i>

<div>

<h1>
Kingdom Ways Church
</h1>

<p>
Church Events & Announcements
</p>

</div>

</div>




<div class="search-box">


<i class="fa-solid fa-search"></i>


<input

type="search"

id="searchEvent"

placeholder="Search events..."

>


</div>


</header>






<!-- =========================
HERO
========================= -->


<section class="hero">


<div>


<h2>

Upcoming Church Events

</h2>


<p>

Stay connected with what is happening in Kingdom Ways Church.

</p>


</div>


</section>







<!-- =========================
FEATURED EVENT
========================= -->


<section

id="featuredZone"

class="featured-zone"

style="display:none;">


<h2>

<i class="fa-solid fa-star"></i>

Featured Event

</h2>


<div

id="featuredContainer">

</div>


</section>







<!-- =========================
EVENT LIST
========================= -->


<section class="events-section">


<div class="section-title">


<h2>

<i class="fa-solid fa-calendar-days"></i>

Church Calendar

</h2>


</div>





<div

id="eventsContainer"

class="events-grid">


<div class="loading">

Loading events...

</div>


</div>



</section>







<footer>


<p>

© 2026 Kingdom Ways Church

<br>

Growing Together in Christ

</p>


</footer>



</div>



<script src="eventclient.js"></script>


</body>


</html>
