<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Church Members</title>

    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="members.css">
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <h2>Kingdom Ways CMS</h2>
        </div>

        <ul class="menu">
           <li><a href="dashboard.html"><i class="fas fa-arrow-left"></i> Back</a></li>

            <li><a href="members.html">👥 Members</a></li>
            <li><a href="ministries.html">🙏 Ministries</a></li>
            <li><a href="events.html">📅 Events</a></li>
            <li><a href="sermons-admin.html">📖 Sermons</a></li>
            <li><a href="galleryadmin.html">🖼 Gallery</a></li>
            <li><a href="settings.html">⚙ Settings</a></li>
            <li><a href="login.html">🚪 Logout</a></li>
        </ul>

    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <main class="main-content">
 
        <!-- Header -->
        <header class="topbar">
            <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
            <h1>Members Management</h1>

            <div class="admin">
                Welcome, Admin
            </div>
        </header>

        <!-- Members Table -->
        <section class="members-table">
<button class="memberAdd-button" id="addMemberBtn">
    + Add Member
</button>
            <h2>Church Members</h2>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Photo</th>
                        <th>Username</th>
                        <th>Gender</th>
                        <th>Phone</th>
                        <th>Ministry</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>

                </thead>
<tbody id="membersTable">

    <!-- Members will be loaded here from the database -->

</tbody>
            </table>

        </section>

    </main>

</div>
<script src="members.js"></script>

<script>
(function(){
    var toggle=document.getElementById("sidebarToggle");
    var sidebar=document.querySelector(".sidebar");
    var overlay=document.getElementById("sidebarOverlay");
    if(!toggle||!sidebar)return;
    function openSidebar(){sidebar.classList.add("open");toggle.classList.add("open");overlay.classList.add("active");}
    function closeSidebar(){sidebar.classList.remove("open");toggle.classList.remove("open");overlay.classList.remove("active");}
    toggle.addEventListener("click",function(){sidebar.classList.contains("open")?closeSidebar():openSidebar();});
    overlay.addEventListener("click",closeSidebar);
})();
</script>

</body>
</html>
