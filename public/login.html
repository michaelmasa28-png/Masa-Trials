<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Admin Login</title>

    <link rel="stylesheet" href="login.css">

</head>


<body>


<div class="login-container">


    <div class="logo">

        <img src="images/logo.png" alt="Church Logo">

    </div>



    <h1>Admin Login</h1>

    <p>Authorized access only</p>



    <form id="loginForm">


        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            required
        >



        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
        >



        <button type="submit">
            Login
        </button>


    </form>



    <p id="message"></p>



</div>



<script src="login.js"></script>


</body>

</html>
